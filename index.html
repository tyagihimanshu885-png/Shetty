<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trump Premium - Photo Style</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui}
body{background:#0e5a2f;min-height:100vh;overflow:hidden;user-select:none}
.felt{position:fixed;inset:0;background:#0e5a2f;display:flex;align-items:center;justify-content:center}
.table{width:100vw;height:100vh;max-width:520px;position:relative;background:radial-gradient(ellipse at center,#1a7a44 0%,#0e5a2f 70%);overflow:hidden}
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
.p-top{top:10px;left:50%;transform:translateX(-50%)}
.p-left{left:6px;top:36%;transform:translateY(-50%)}
.p-right{right:6px;top:36%;transform:translateY(-50%)}
.p-bottom{bottom:0;left:50%;transform:translateX(-50%);width:100%;z-index:20}
.avatar{width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;border:3px solid #ffca28;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:15px}
.avatar.active{border-color:#00e676;box-shadow:0 0 12px #00e676;background:#e8f5e9}
.nameTag{background:rgba(0,0,0,.85);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;text-align:center;line-height:1.1;min-width:42px}
.nameTag b{color:#ffca28;font-size:12px}
.cards{display:flex;justify-content:center}
.card{width:46px;height:66px;background:#fff;border-radius:6px;border:1px solid #777;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s;margin-left:-6px;position:relative}
.card:first-child{margin-left:0}
.card.red{color:#d32f2f}.card.black{color:#111}
.card.back{background:repeating-linear-gradient(45deg,#1a3a5a,#1a3a5a 4px,#2a5a8a 4px,#2a5a8a 8px);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.p-top .cards{margin-top:6px}
.p-top .card{width:28px;height:38px;margin-left:-14px;border-width:1px;border-radius:3px}
.p-left .cards,.p-right .cards{flex-direction:column;margin-top:6px}
.p-left .card,.p-right .card{width:38px;height:28px;margin-left:0;margin-top:-18px;transform:none;border-radius:3px}
.p-left .card:first-child,.p-right .card:first-child{margin-top:0}
.p-bottom .cards{width:98vw;max-width:520px;padding:0 4px;gap:0;justify-content:center}
.p-bottom .card{width:7.8vw;max-width:44px;min-width:31px;height:68px;margin-left:-3px;font-size:12px;border-radius:5px 5px 0 0;transition:transform .3s ease}
.p-bottom .card:hover{transform:translateY(-14px);z-index:30}
@media(max-width:380px){.p-bottom .card{width:7.5vw;height:60px;font-size:10px}}
.centerWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:260px;height:170px;z-index:6;display:flex;align-items:center;justify-content:center}
.trumpCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;opacity:0.35;color:#fff;font-weight:900;pointer-events:none;z-index:1;text-shadow:0 0 30px #000,0 0 50px #000}
.trumpCenter.red{color:#ff8a8a;opacity:0.45}
.centerCards{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2}
.centerCards .card{position:absolute;width:68px;height:92px;margin:0;animation:throwSlow .65s ease-out;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.centerCards .card:nth-child(1){transform:translate(-58px,-12px) rotate(-8deg)}
.centerCards .card:nth-child(2){transform:translate(58px,-12px) rotate(8deg)}
.centerCards .card:nth-child(3){transform:translate(-34px,26px) rotate(-4deg)}
.centerCards .card:nth-child(4){transform:translate(34px,26px) rotate(4deg)}
@keyframes throwSlow{0%{transform:translateY(130px) scale(0.4);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1)}}
.turnBar{position:absolute;left:2%;right:2%;top:62%;background:#ff9800;color:#000;padding:6px 10px;border-radius:4px;font-weight:700;font-size:12px;z-index:15;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.scoreBoard{position:absolute;right:6px;bottom:78px;background:rgba(255,255,255,.94);border:1px solid #000;border-radius:3px;padding:3px;font-size:9px;z-index:25;min-width:118px;color:#000;line-height:1.2}
.scoreBoard table{width:100%;border-collapse:collapse}
.scoreBoard td,.scoreBoard th{border:1px solid #555;padding:2px 4px;text-align:center}
.scoreBoard th{background:#ddd}
.ui{position:fixed;left:4px;top:4px;background:rgba(0,0,0,.85);color:#fff;padding:6px 8px;border-radius:8px;font-size:9px;min-width:190px;z-index:100;transition:all .4s}
.ui.hideGame{opacity:0;pointer-events:none;transform:translateY(-20px)}
.btn{padding:6px 10px;border-radius:7px;border:none;font-weight:700;cursor:pointer;margin:2px;font-size:11px}
.by{background:#ffca28;color:#000}.bg{background:#2e7d32;color:#fff}.bb{background:#1565c0;color:#fff}
input{width:100%;padding:6px;border-radius:6px;border:none;margin:3px 0;color:#000;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:300}
.modalBox{background:#123e33;border-radius:12px;padding:14px;max-width:440px;width:94%;border:2px solid #1f6b55;text-align:center}
.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bidbox{padding:4px 7px;background:#0e3a2e;border-radius:6px;margin:2px 0;font-size:11px;display:flex;justify-content:space-between;color:#fff}
</style>
</head>
<body>
<div class="felt"><div class="table">
<div class="player p-top" id="seat-C"><div class="avatar" id="av-C">C</div><div class="nameTag" id="tag-C">C<br><b>0/4</b></div><div class="cards" id="hand-C"></div></div>
<div class="player p-left" id="seat-B"><div class="avatar" id="av-B">B</div><div class="nameTag" id="tag-B">B<br><b>0/3</b></div><div class="cards" id="hand-B"></div></div>
<div class="player p-right" id="seat-D"><div class="avatar" id="av-D">D</div><div class="nameTag" id="tag-D">D<br><b>0/2</b></div><div class="cards" id="hand-D"></div></div>
<div class="centerWrap" id="centerWrap"><div id="trumpCenter" class="trumpCenter"></div><div id="centerCards" class="centerCards"></div></div>
<div id="turnBar" class="turnBar hidden">Your turn!</div>
<div class="player p-bottom" id="seat-A"><div class="avatar" id="av-A">A</div><div class="nameTag" id="tag-A">A<br><b>0/4</b></div><div class="scoreBoard" id="scoreBoard"><table><tr><th>Team</th><th>Score</th><th>Bagh</th></tr><tr><td id="team1">A & C</td><td id="sc1">0</td><td id="bg1">0</td></tr><tr><td id="team2">B & D</td><td id="sc2">0</td><td id="bg2">0</td></tr></table></div><div class="cards" id="hand-A"></div></div>
</div></div>
<div class="ui" id="uiBox">
<div><b>Room:</b> <span id="roomIdTxt">-</span> <button class="btn by" onclick="copyRoom()">COPY</button> <button class="btn bb" onclick="shareWA()">WA</button></div>
<div>Game <b id="gno">1</b>/15 | Dealer <b id="dealer">-</b> | Bidder <b id="bidder">-</b></div>
<div>Trump: <b id="trump" style="color:#ff5252">?</b> | <span id="phase">Lobby</span></div>
<div id="bids"></div><div id="scores"></div><div id="lobbyInfo"></div>
</div>
<div id="modal" class="modal"><div class="modalBox">
<h3 style="color:#ffca28">🃏 Trump Premium Online</h3>
<p style="font-size:11px;color:#ffe082;margin:6px 0">A 5-5 baatega, B 5 dekh ke Trump + Bid, fir 13-13, sab bid, B se chaal, 4 pe 40, kam pe -40, extra 41,42... extra 10 pe -100, 15 games</p>
<input id="myName" placeholder="Tumhara Naam">
<div class="row" style="margin-top:8px"><button class="btn by" onclick="createRoom()">ROOM BANAO (Dost bulana)</button></div>
<div class="row"><input id="joinId" placeholder="Room ID" style="flex:1"><button class="btn bb" onclick="joinRoom()">JOIN</button></div>
</div></div>
<div id="bidModal" class="modal hidden"><div class="modalBox">
<h3 id="bidTitle" style="color:#ffca28">Bid</h3><div id="bidCards" class="row" style="margin:8px 0"></div><div id="bidBtns"></div><div id="trumpBtns" style="margin-top:8px"></div>
</div></div>
<script>
let myName="",roomId="",peer=null,conns={},isHost=false,players=[],dealer=0,bidder=1,gameNo=1,scores={},extra={},hands={},bids={},trump="",tricksWon={},center=[],turn=1,trick=1,deck=[],isBotGame=false;
const suits=["♠","♥","♦","♣"],ranks=["A","K","Q","J","10","9","8","7","6","5","4","3","2"],pow={A:14,K:13,Q:12,J:11,"10":10,"9":9,"8":8,"7":7,"6":6,"5":5,"
